# Loaded by @ActiveProfiles("test"); overrides the PostgreSQL settings in application.properties.

# In-memory H2 database in PostgreSQL compatibility mode, recreated for every test run
spring.datasource.url=jdbc:h2:mem:rbac_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# Fixed test-only secret (never used outside tests)
jwt.secret=test-secret-for-unit-tests-only-32-chars-min
jwt.expiration-ms=3600000
