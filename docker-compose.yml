# Local stack: PostgreSQL + the API. Run with:  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rbac_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres        # local development only
    ports:
      - "5432:5432"
    healthcheck:                         # lets the API wait until the DB accepts connections
      test: ["CMD-SHELL", "pg_isready -U postgres -d rbac_db"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rbac_db   # "db" is the service name above
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: local-dev-secret-change-me-at-least-32-chars   # local development only
    ports:
      - "8080:8080"
